<style>
:root{
  --bg:#0A0A0B; --hairline:rgba(242,239,234,.09); --hairline-soft:rgba(242,239,234,.055);

  --red:#C8323C; --red-lift:#E04A54;
  --font:"Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --ease:cubic-bezier(.22,1,.36,1); --ease-soft:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100svh;
  background:var(--bg); color:var(--ink);

}
a{ color:inherit; text-decoration:none; }
h1{ margin:0; }
::selection{ background:var(--red); color:#fff; }
:focus-visible{ outline:1.5px solid var(--red-lift); outline-offset:4px; border-radius:3px; }

.glow{
  position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0;
  width:60vw; height:60vw; min-width:520px; min-height:520px; top:-24vw; left:-10vw;
  background:radial-gradient(circle, rgba(200,50,60,.22), transparent 68%);
}
.inner{ position:relative; z-index:1; width:100%; max-width:1220px; margin-inline:auto; padding-inline:var(--gutter); }

.code{
  display:inline-flex; align-items:center; gap:.6rem;
  font-family:var(--mono); font-size:.6875rem; font-weight:500;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3);
  padding:.45rem .9rem .45rem .75rem;
  border:1px solid var(--hairline); border-radius:100px;
  background:rgba(242,239,234,.02);
}
.code i{ width:5px; height:5px; border-radius:50%; background:var(--red); flex:none; }

h1{
  margin-top:clamp(1.75rem,4vw,2.5rem);
  font-size:clamp(2.5rem,7vw,5rem); line-height:1; font-weight:400; letter-spacing:-.045em;
  max-width:14ch;
}
h1 .muted{ color:var(--ink-3); }
p{
  margin:clamp(1.5rem,3vw,2rem) 0 0;
  max-width:44ch; font-weight:300; color:var(--ink-2);
}
.cta{ margin-top:clamp(2.25rem,5vw,3rem); display:flex; flex-wrap:wrap; gap:.75rem 1rem; }
.btn{
  display:inline-flex; align-items:center; gap:.5rem;
  height:42px; padding-inline:1.0625rem; border-radius:9px; border:1px solid transparent;
  font-size:.875rem; font-weight:500;
  transition:background .22s var(--ease-soft), border-color .22s var(--ease-soft), color .22s var(--ease-soft);
}
.btn svg{ width:13px; height:13px; opacity:.55; transition:transform .35s var(--ease), opacity .22s var(--ease-soft); }
.btn:hover svg{ transform:translateX(2px); opacity:1; }
.btn-primary{ background:var(--ink); color:#0A0A0B; }
.btn-primary:hover{ background:#fff; }
.btn-ghost{ color:var(--ink-2); background:rgba(242,239,234,.028); border-color:var(--hairline); }
.btn-ghost:hover{ color:var(--ink); background:rgba(242,239,234,.062); border-color:rgba(242,239,234,.16); }

.mark{
  display:inline-flex; align-items:center; gap:.6rem;
  margin-top:clamp(3.5rem,9vh,6rem); padding-top:1.75rem;
  border-top:1px solid var(--hairline-soft); width:100%;
  font-family:var(--mono); font-size:.6875rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-4);
}
.mark svg{ width:16px; height:16px; color:var(--red); }

@media (prefers-reduced-motion:reduce){ *{ transition-duration:.001ms !important; } }
</style>
</head>
