<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Geist';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-latin.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-mono-latin.woff2') format('woff2-variations');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0A0A0B;
    color: #F2EFEA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    background: #F6F3EE; color: #14110F;
  }

  .glow-bg {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200, 50, 60, 0.22) 0%, rgba(200, 50, 60, 0.06) 45%, transparent 70%);
    border-radius: 50%;
  }

  /* Facebook circular safe guide (920px diameter inside 1024px) */
  .fb-safe-guide {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.02);
    pointer-events: none;
  }

  
        .light-ring {
            position: absolute;
            width: 840px;
            height: 840px;
            border-radius: 50%;
            border: 1px solid rgba(20, 17, 15, 0.08);
        }
        .center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 5;
        }
        .mark-wrap-light {
            width: 250px;
            height: 250px;
            filter: drop-shadow(0 4px 20px rgba(168, 30, 40, 0.15));
        }
        .light-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .light-s7 {
            font-size: 88px;
            font-weight: 700;
            color: #14110F;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .light-sub {
            font-family: 'Geist Mono', monospace;
            font-size: 24px;
            font-weight: 600;
            color: rgba(20, 17, 15, 0.65);
            letter-spacing: 0.26em;
            text-indent: 0.26em;
        }
        
</style>
</head>
<body>
  <div class="fb-safe-guide"></div>
  
        <div class="light-ring"></div>
        <div class="center-col">
            <div class="mark-wrap-light">
                <svg class="khatem-svg" viewBox="0 0 100 100">
                    <g fill="none" stroke="#A81E28" stroke-width="5.5" stroke-linejoin="round">
                        <rect x="26" y="26" width="48" height="48" rx="2" />
                        <rect x="26" y="26" width="48" height="48" rx="2" transform="rotate(45 50 50)" />
                    </g>
                    <circle cx="50" cy="50" r="3.5" fill="#8E1720" />
                </svg>
            </div>
            <div class="light-text">
                <div class="light-s7">S7</div>
                <div class="light-sub">SERVICE7</div>
            </div>
        </div>
        
</body>
</html>
