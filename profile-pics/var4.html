<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Geist';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-latin.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-mono-latin.woff2') format('woff2-variations');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0A0A0B;
    color: #F2EFEA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    
  }

  .glow-bg {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200, 50, 60, 0.22) 0%, rgba(200, 50, 60, 0.06) 45%, transparent 70%);
    border-radius: 50%;
  }

  /* Facebook circular safe guide (920px diameter inside 1024px) */
  .fb-safe-guide {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.02);
    pointer-events: none;
  }

  
        .badge-ring-outer {
            position: absolute;
            width: 820px;
            height: 820px;
            border-radius: 50%;
            border: 1px dashed rgba(242, 239, 234, 0.12);
        }
        .badge-ring-inner {
            position: absolute;
            width: 760px;
            height: 760px;
            border-radius: 50%;
            border: 1px solid rgba(200, 50, 60, 0.25);
            box-shadow: inset 0 0 60px rgba(200, 50, 60, 0.08);
        }
        .glow-bg-badge {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(200, 50, 60, 0.22) 0%, transparent 70%);
            border-radius: 50%;
        }
        .center-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            z-index: 5;
        }
        .mark-wrap-badge {
            width: 250px;
            height: 250px;
            filter: drop-shadow(0 0 25px rgba(200, 50, 60, 0.45));
        }
        .badge-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .badge-s7 {
            font-size: 46px;
            font-weight: 700;
            color: #F2EFEA;
            letter-spacing: 0.12em;
        }
        .badge-sub {
            font-family: 'Geist Mono', monospace;
            font-size: 17px;
            color: rgba(242, 239, 234, 0.45);
            letter-spacing: 0.32em;
            text-indent: 0.32em;
        }
        
</style>
</head>
<body>
  <div class="fb-safe-guide"></div>
  
        <div class="badge-ring-outer"></div>
        <div class="badge-ring-inner"></div>
        <div class="glow-bg-badge"></div>
        <div class="center-col">
            <div class="mark-wrap-badge">
                <svg class="khatem-svg" viewBox="0 0 100 100">
                    <g fill="none" stroke="#C8323C" stroke-width="5" stroke-linejoin="round">
                        <rect x="26" y="26" width="48" height="48" rx="2" />
                        <rect x="26" y="26" width="48" height="48" rx="2" transform="rotate(45 50 50)" />
                    </g>
                    <!-- Inner delicate square -->
                    <rect x="36" y="36" width="28" height="28" fill="none" stroke="rgba(242, 239, 234, 0.18)" stroke-width="1.5" />
                    <circle cx="50" cy="50" r="3.5" fill="#E04A54" />
                </svg>
            </div>
            <div class="badge-label">
                <span class="badge-s7">SERVICE<span style="color:#C8323C">7</span></span>
                <span class="badge-sub">ENGINEERING STUDIO</span>
            </div>
        </div>
        
</body>
</html>
