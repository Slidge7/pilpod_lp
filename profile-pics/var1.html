<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Geist';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-latin.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('c:/Users/T14/Desktop/s7/s7 site/s7-webapp/src/assets/fonts/geist-mono-latin.woff2') format('woff2-variations');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0A0A0B;
    color: #F2EFEA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    
  }

  .glow-bg {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200, 50, 60, 0.22) 0%, rgba(200, 50, 60, 0.06) 45%, transparent 70%);
    border-radius: 50%;
  }

  /* Facebook circular safe guide (920px diameter inside 1024px) */
  .fb-safe-guide {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.02);
    pointer-events: none;
  }

  
        .mark-container {
            width: 440px;
            height: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 35px rgba(200, 50, 60, 0.45));
        }
        .khatem-svg {
            width: 100%;
            height: 100%;
        }
        
</style>
</head>
<body>
  <div class="fb-safe-guide"></div>
  
        <div class="glow-bg"></div>
        <div class="mark-container">
            <svg class="khatem-svg" viewBox="0 0 100 100">
                <g fill="none" stroke="#C8323C" stroke-width="5" stroke-linejoin="round">
                    <rect x="26" y="26" width="48" height="48" rx="2" />
                    <rect x="26" y="26" width="48" height="48" rx="2" transform="rotate(45 50 50)" />
                </g>
                <circle cx="50" cy="50" r="3.5" fill="#E04A54" />
            </svg>
        </div>
        
</body>
</html>
